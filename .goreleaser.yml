# GoReleaser configuration for gtb
# See https://goreleaser.com for documentation

version: 2

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy

builds:
  - id: gtb
    main: ./cmd/gtb
    binary: gtb
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      # linux/arm64 cross-compiles CGO with the aarch64 toolchain.
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      # darwin builds are CGO-free: the gms_pure_go tag switches go-mysql-server
      # to its pure-Go regex engine, so no ICU library is needed. This keeps
      # darwin cross-compilation from Linux working without a clang/osxcross toolchain.
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=0
        flags:
          - -tags=gms_pure_go
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=0
        flags:
          - -tags=gms_pure_go
    ldflags:
      - -s -w
      - -X github.com/steveyegge/gastown/internal/cmd.Version={{.Version}}
      - -X github.com/steveyegge/gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Branch={{.Branch}}

archives:
  - id: gtb-archive
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Features"
      regexp: '^.*feat(\(\w+\))?:.*$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*fix(\(\w+\))?:.*$'
      order: 1
    - title: "Others"
      order: 999

release:
  github:
    owner: baovo15
    name: gtb
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "v{{.Version}}"
  header: |
    ## gtb v{{.Version}}

    Pre-compiled `gtb` binaries for Linux and macOS (amd64 & arm64).

    ### Installation

    Download the archive for your platform below, verify it against `checksums.txt`, extract it, and place `gtb` in your PATH.

# Announce the release
announce:
  skip: false
