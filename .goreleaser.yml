# GoReleaser configuration for Gas Town (gt)
# See https://goreleaser.com for documentation

version: 2

builds:
  # Why: CGO_ENABLED=1 linked libicui18n dynamically against the build runner's
  # ICU (Ubuntu ships 74). Any host with a different ICU major - Arch ships 76 -
  # could not execute the published binary at all:
  #   "libicui18n.so.74: cannot open shared object file".
  # A distributed binary must not inherit the builder's shared-library ABI.
  # CGO_ENABLED=0 produces a static executable that runs on every glibc/musl
  # host, which is what a release artifact consumed via mise must guarantee.
  - id: gt-linux-amd64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/steveyegge/gastown/internal/cmd.Version={{.Version}}
      - -X github.com/steveyegge/gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Branch={{.Branch}}

  - id: gt-freebsd-amd64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/steveyegge/gastown/internal/cmd.Version={{.Version}}
      - -X github.com/steveyegge/gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Branch={{.Branch}}


archives:
  - id: gt-archive
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Features"
      regexp: '^.*feat(\(\w+\))?:.*$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*fix(\(\w+\))?:.*$'
      order: 1
    - title: "Others"
      order: 999

release:
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "v{{.Version}}"
  header: |
    ## Gas Town v{{.Version}}

    Pre-compiled binaries for Linux, macOS (Intel & Apple Silicon), and Windows.

    ### Installation

    **Homebrew (macOS/Linux):**
    ```bash
    brew install gastown
    ```

    **npm (Node.js):**
    ```bash
    npm install -g @gastown/gt
    ```

    **Manual Install:**
    Download the appropriate binary for your platform below, extract it, and place it in your PATH.

# Announce the release
announce:
  skip: false
