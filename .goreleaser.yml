# GoReleaser configuration for Gas Town (gt)
# See https://goreleaser.com for documentation

version: 2

builds:
  # gtf-zty: CGO_ENABLED=1 linked the release against the ICU that Dolt's
  # indirect deps (dolthub/go-icu-regex, dolthub/gozstd) pull in, baking the
  # build host's soname into the artifact. The published binary therefore
  # demanded libicui18n.so.74 and could not start on any distro shipping a
  # different ICU (Arch/CachyOS carry 69/76/78), which forced local builds.
  # gastown has no `import "C"` of its own, so the pure-Go build is complete
  # and portable - the same choice gt-freebsd-amd64 already makes below.
  - id: gt-linux-amd64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/steveyegge/gastown/internal/cmd.Version={{.Version}}
      - -X github.com/steveyegge/gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Branch={{.Branch}}

  - id: gt-freebsd-amd64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/steveyegge/gastown/internal/cmd.Version={{.Version}}
      - -X github.com/steveyegge/gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/steveyegge/gastown/internal/cmd.Branch={{.Branch}}


archives:
  - id: gt-archive
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Features"
      regexp: '^.*feat(\(\w+\))?:.*$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*fix(\(\w+\))?:.*$'
      order: 1
    - title: "Others"
      order: 999

release:
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "v{{.Version}}"
  header: |
    ## Gas Town v{{.Version}}

    Pre-compiled binaries for Linux, macOS (Intel & Apple Silicon), and Windows.

    ### Installation

    **Homebrew (macOS/Linux):**
    ```bash
    brew install gastown
    ```

    **npm (Node.js):**
    ```bash
    npm install -g @gastown/gt
    ```

    **Manual Install:**
    Download the appropriate binary for your platform below, extract it, and place it in your PATH.

# Announce the release
announce:
  skip: false
