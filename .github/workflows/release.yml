name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  portable:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
      - name: Verify release input
        run: |
          set -euo pipefail
          if grep -qE '^replace\s' go.mod; then
            echo 'ERROR: go.mod contains replace directives.' >&2
            exit 1
          fi
          make check-version-tag
      - name: Build Linux AMD64 and FreeBSD AMD64 archives
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish --skip=announce
      - name: Smoke Linux AMD64 binary
        run: |
          set -euo pipefail
          binary="$(find dist -type f -path '*linux_amd64*/gt' -print -quit)"
          test -n "${binary}"
          "${binary}" version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-archives
          path: |
            dist/gastown_*_linux_amd64.tar.gz
            dist/gastown_*_freebsd_amd64.tar.gz
          if-no-files-found: error

  linux-arm64:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
      # Why: see .goreleaser.yml - a CGO build linked libicui18n against the
      # runner's ICU major, so the published artifact failed to start on hosts
      # with any other ICU. Static linking is required for a distributed binary.
      - name: Build, smoke and package Linux ARM64
        env:
          CGO_ENABLED: '0'
          GOARCH: arm64
          GOOS: linux
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/steveyegge/gastown/internal/cmd.Version=${version} -X github.com/steveyegge/gastown/internal/cmd.Build=$(git rev-parse --short HEAD) -X github.com/steveyegge/gastown/internal/cmd.Commit=$(git rev-parse HEAD) -X github.com/steveyegge/gastown/internal/cmd.Branch=$(git branch --show-current)"
          go build -ldflags "${ldflags}" -o gt ./cmd/gt
          ./gt version
          staging="gastown_${version}_linux_arm64"
          mkdir -p "${staging}"
          cp gt LICENSE README.md "${staging}/"
          tar -czf "${staging}.tar.gz" -C "${staging}" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-archive
          path: gastown_*_linux_arm64.tar.gz
          if-no-files-found: error

  windows-amd64:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: false
      - uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d # v2.31.0
        with:
          path-type: inherit
          msystem: UCRT64
          pacboy: icu:p toolchain:p pkg-config:p
      - name: Build Windows AMD64
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/steveyegge/gastown/internal/cmd.Version=${version} -X github.com/steveyegge/gastown/internal/cmd.Build=$(git rev-parse --short HEAD) -X github.com/steveyegge/gastown/internal/cmd.Commit=$(git rev-parse HEAD) -X github.com/steveyegge/gastown/internal/cmd.Branch=$(git branch --show-current)"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -buildmode=exe -ldflags "${ldflags}" -o gt.exe ./cmd/gt
          ./gt.exe version
      - name: Package Windows AMD64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $staging = "gastown_${version}_windows_amd64"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item gt.exe "$staging/gt.exe"
          Copy-Item LICENSE, README.md $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "${staging}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-amd64-archive
          path: gastown_*_windows_amd64.zip
          if-no-files-found: error

  macos:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
      - name: Install ICU4C
        run: brew install icu4c
      - name: Build, smoke and package macOS
        env:
          CGO_ENABLED: '1'
          GOARCH: ${{ matrix.arch }}
          GOOS: darwin
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          icu_prefix="$(brew --prefix icu4c)"
          export CGO_CPPFLAGS="-I${icu_prefix}/include"
          export CGO_LDFLAGS="-L${icu_prefix}/lib"
          ldflags="-s -w -X github.com/steveyegge/gastown/internal/cmd.Version=${version} -X github.com/steveyegge/gastown/internal/cmd.Build=$(git rev-parse --short HEAD) -X github.com/steveyegge/gastown/internal/cmd.Commit=$(git rev-parse HEAD) -X github.com/steveyegge/gastown/internal/cmd.Branch=$(git branch --show-current)"
          go build -ldflags "${ldflags}" -o gt ./cmd/gt
          codesign -s - -f gt
          ./gt version
          staging="gastown_${version}_darwin_${GOARCH}"
          mkdir -p "${staging}"
          cp gt LICENSE README.md "${staging}/"
          tar -czf "${staging}.tar.gz" -C "${staging}" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-archive
          path: gastown_*_darwin_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [portable, linux-arm64, windows-amd64, macos]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete immutable asset set
        id: assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "gastown_${version}_linux_amd64.tar.gz"
            "gastown_${version}_linux_arm64.tar.gz"
            "gastown_${version}_freebsd_amd64.tar.gz"
            "gastown_${version}_windows_amd64.zip"
            "gastown_${version}_darwin_arm64.tar.gz"
            "gastown_${version}_darwin_amd64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -s "dist/${asset}" || { echo "Missing release asset: ${asset}" >&2; exit 1; }
          done
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq "${#expected[@]}"
          checksums="dist/gastown_${version}_checksums.txt"
          (cd dist && sha256sum "${expected[@]}") > "${checksums}"
          echo "checksums=${checksums}" >> "${GITHUB_OUTPUT}"
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/gastown-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest release archives
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}
          sbom-path: dist/gastown-${{ github.ref_name }}.spdx.json
      - name: Publish complete fork release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'marlon-costa-dc/gastown'
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            if [ "${is_draft}" != true ]; then
              echo "Published release ${GITHUB_REF_NAME} already exists; refusing to mutate it." >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --prerelease \
              --verify-tag \
              --title "Gas Town ${GITHUB_REF_NAME}" \
              --notes "Attested Gas Town fork build. Install only from the assets attached to this release."
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
