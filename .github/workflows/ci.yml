name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Guard: go.mod must not contain replace directives — they break `go install`.
  # See: https://github.com/steveyegge/gastown/issues/2230
  check-no-replace-directives:
    name: Reject go.mod replace directives
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check for replace directives in go.mod
        run: |
          if grep -qE '^replace\s' go.mod; then
            echo "ERROR: go.mod contains replace directives."
            echo ""
            echo "Replace directives break 'go install github.com/steveyegge/gastown/cmd/gt@latest'."
            echo "See: https://github.com/steveyegge/gastown/issues/2230"
            echo ""
            echo "Found:"
            grep -n '^replace' go.mod
            echo ""
            echo "Remove replace directives before merging to main."
            exit 1
          fi
          echo "OK: no replace directives in go.mod"

  # Guard: gastown no longer supports issues.jsonl — Dolt server is the only backend.
  check-no-issues-jsonl:
    name: Reject issues.jsonl
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Reject issues.jsonl if present
        run: |
          if [ -f .beads/issues.jsonl ]; then
            echo "ERROR: .beads/issues.jsonl must not exist in the repository."
            echo ""
            echo "Gastown requires a Dolt server — issues.jsonl is no longer supported."
            echo ""
            echo "To fix, run:"
            echo "  git rm .beads/issues.jsonl"
            echo "  git commit --amend"
            echo "  git push --force"
            echo ""
            exit 1
          fi
          echo "OK: no issues.jsonl found"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@gastown.test"

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/download/v2.0.7/install.sh | sudo bash

      - name: Set up beads (bd)
        uses: ./.github/actions/setup-bd

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Build
        run: go build -v ./cmd/gt

      - name: Test with Coverage
        run: |
          set -o pipefail
          gotestsum --format testname --junitfile junit.xml -- -race -short -timeout=10m -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt

      - name: Test Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/junit-report.py junit.xml "Unit Test Failures"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.11.4
          args: --timeout=5m
          # Config schema verification fetches a remote JSON schema and made
          # lint availability depend on golangci-lint.run. The pinned linter
          # still parses and enforces the complete local config during run.
          verify: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install ICU4C development headers
        run: sudo apt-get install -y libicu-dev

      - name: Configure Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@gastown.test"

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/download/v2.0.7/install.sh | sudo bash

      - name: Pre-pull Dolt Docker image
        run: docker pull dolthub/dolt-sql-server:2.0.7

      # One Dolt endpoint for the WHOLE job (gtf-s7p).
      #
      # The step below runs five separate gotestsum invocations. Each is its
      # own test binary, so each used to run its own TestMain, its own
      # sync.Once, and therefore its own ephemeral container on a DIFFERENT
      # mapped port — with the previous container torn down as that binary
      # exited.
      #
      # That is fatal because the port is persisted, not just passed: bd init
      # writes .beads/dolt-server.port and metadata.json.dolt_server_port, and
      # beads/config_sql.go prefers that stored value over GT_DOLT_PORT. A
      # beads dir created under one shard therefore kept dialling a container
      # that no longer existed, producing
      # "Dolt server unreachable at 127.0.0.1:<port>: connection refused".
      #
      # Pinning one container on a FIXED host port for the entire job makes the
      # persisted value and the live endpoint agree for every shard.
      - name: Start shared Dolt server
        run: |
          set -euo pipefail
          docker run -d --name gt-ci-dolt \
            -p 3307:3306 \
            -e DOLT_ROOT_HOST=% \
            dolthub/dolt-sql-server:2.0.7
          for i in $(seq 1 60); do
            if docker exec gt-ci-dolt dolt sql -q 'select 1' >/dev/null 2>&1; then
              echo "Dolt ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Dolt did not become ready in 60s" >&2
          docker logs gt-ci-dolt >&2
          exit 1

      - name: Set up beads (bd)
        uses: ./.github/actions/setup-bd

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Build gt
        run: |
          make build
          cp gt "$(go env GOPATH)/bin/"

      - name: Integration Tests
        env:
          # Point every shard at the single job-scoped server above. With these
          # set, testutil reuses this endpoint instead of starting a per-binary
          # container, so the port stays stable across all five invocations.
          GT_DOLT_HOST: 127.0.0.1
          GT_DOLT_PORT: "3307"
          BEADS_DOLT_PORT: "3307"
          GT_TEST_EXTERNAL_DOLT: "1"
        run: |
          status=0

          gotestsum --format testname --junitfile junit-integration.xml -- \
            -tags=integration -timeout=15m -v ./internal/cmd/... || status=1

          gotestsum --format testname --junitfile junit-scheduler-1.xml -- \
            -tags='integration scheduler_integration' -timeout=15m -v \
            -run '^(TestScheduler(CircuitBreakerExclusion|AutoConvoyCreation|BlockedStatusReporting|SlingDryRun|SlingContextIdempotency|SlingContextWorkBeadPristine))$' \
            ./internal/cmd || status=1

          gotestsum --format testname --junitfile junit-scheduler-2.xml -- \
            -tags='integration scheduler_integration' -timeout=15m -v \
            -run '^(TestScheduler(MultiRigDispatch|MultiRigEpicAutoResolve|ConvoyFlagRejection|EpicFlagRejection|EpicDetection|MixedBatchRejection|MultiRigConvoyAutoResolve))$' \
            ./internal/cmd || status=1

          gotestsum --format testname --junitfile junit-scheduler-3.xml -- \
            -tags='integration scheduler_integration' -timeout=15m -v \
            -run '^(TestScheduler(DisabledMode|DirectModeNoQueue|DeferredTaskWithoutRig|DeferredNonRigRejection|DeferredAcceptsDogTarget|DirectEpicDispatch|BatchEpicRejection))$' \
            ./internal/cmd || status=1

          gotestsum --format testname --junitfile junit-scheduler-4.xml -- \
            -tags='integration scheduler_integration' -timeout=15m -v \
            -run '^(TestScheduler(InvalidJSONContextCleanup|ActualDispatchRoutesPollutedEnvToTargetRig|FormulaDispatchRoutesPollutedEnvToTargetRig|DispatchFailureRecordedInContextSourceDB|DirectConvoyDispatch)|TestScheduleBead_(RefusesClosed|RefusesTombstone|ClosedForceDoesNotBypass))$' \
            ./internal/cmd || status=1

          exit "$status"

      - name: Test Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=0
          python3 .github/scripts/junit-report.py junit-integration.xml "Integration Test Failures" || status=1
          python3 .github/scripts/junit-report.py junit-scheduler-1.xml "Scheduler Integration Failures 1" || status=1
          python3 .github/scripts/junit-report.py junit-scheduler-2.xml "Scheduler Integration Failures 2" || status=1
          python3 .github/scripts/junit-report.py junit-scheduler-3.xml "Scheduler Integration Failures 3" || status=1
          python3 .github/scripts/junit-report.py junit-scheduler-4.xml "Scheduler Integration Failures 4" || status=1
          exit "$status"
