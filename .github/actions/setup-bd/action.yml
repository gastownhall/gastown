name: Set up beads (bd)
description: Resolve, cache, install, and expose the bd CLI used by Gastown tests.

inputs:
  cache-prefix:
    description: Prefix for the actions/cache key.
    required: false
    default: beads
  repository:
    description: Governed downstream Beads release repository.
    required: false
    default: marlon-costa-dc/beads

runs:
  using: composite
  steps:
    - name: Resolve beads version
      id: beads-version
      shell: bash
      env:
        GH_REPO: ${{ inputs.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name')"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache beads (bd)
      id: cache-beads
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/go/bin/bd
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beads-version.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}

    - name: Install beads (bd)
      if: steps.cache-beads.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_REPO: ${{ inputs.repository }}
        GH_TOKEN: ${{ github.token }}
        BD_VERSION: ${{ steps.beads-version.outputs.version }}
      run: |
        version="${BD_VERSION#v}"
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset="beads_${version}_linux_amd64.tar.gz" ;;
          Linux-ARM64) asset="beads_${version}_linux_arm64.tar.gz" ;;
          macOS-X64) asset="beads_${version}_darwin_amd64.tar.gz" ;;
          macOS-ARM64) asset="beads_${version}_darwin_arm64.tar.gz" ;;
          *) echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        release_dir="${RUNNER_TEMP}/bd-release"
        mkdir -p "$release_dir"
        gh release download "$BD_VERSION" --repo "$GH_REPO" --pattern "$asset" --dir "$release_dir" --clobber
        tar -xzf "$release_dir/$asset" -C "$release_dir"
        binary="$(find "$release_dir" -type f -name bd -print -quit)"
        test -n "$binary"
        install -m 0755 "$binary" "$(go env GOPATH)/bin/bd"

    - name: Add Go bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
