description = """
Standing patrol for open PR review feedback and failing CI checks.

Scans all open PRs across rigs, identifies those needing attention (review
feedback or failing CI), and dispatches polecat work beads for each finding.
A dedup guard prevents re-slinging polecats for PRs that already have unclosed beads.

## Purpose

Without this patrol, review feedback and CI failures on open PRs go unnoticed
until someone manually checks GitHub. This patrol closes that gap by running
continuously and dispatching polecats to address findings.

## Rig Parameterization

The patrol is generic — it operates on a specified rig. Run one patrol instance
per rig, or configure a single instance to scan multiple repos.

## Dispatch Strategy

For each actionable PR finding, the patrol:
1. Checks for an unclosed bead tagged with the PR number (dedup guard)
2. If no existing bead, creates a new bead with PR context (URL, branch, type, check names)
3. Slings a polecat onto the PR's head branch (`--branch <head> --no-merge`),
   so the fix is pushed to the existing PR instead of a new branch

One bead per PR. If an unclosed bead already exists for that PR, it is skipped.

## PR Actionability Criteria

A PR is actionable if any of the following are true:
- reviewDecision == "CHANGES_REQUESTED"
- statusCheckRollup contains a failed check (CheckRun conclusion FAILURE,
  TIMED_OUT or STARTUP_FAILURE, or StatusContext state FAILURE or ERROR)
- Any unresolved review thread (not yet checked by the steps below)

Draft PRs are excluded from actionability by default.

A change request only counts if it was submitted after the PR's head commit.
Once a fix is pushed, the PR waits for re-review instead of being re-dispatched.

## Scope

By default only PRs authored by the `gh` user running the patrol are scanned
(`author = "@me"`). In a shared repository, scanning every open PR would send
polecats to push onto other people's branches. Set `author = ""` to scan all
authors, and `head_prefix` (e.g. `polecat/`) to limit scope further.

## Variables

| Variable | Default | Description |
|----------|---------|-------------|
| wisp_type | patrol | Type of wisp — patrol loops continuously |
| rig | (required) | Target rig to sling polecats to for found work |
| repo | (required) | GitHub repo in owner/name format (e.g. acme/myapp) |
| base_branch | main | Base branch filter for open PRs |
| scan_interval_seconds | 300 | Seconds to sleep between patrol cycles |
| exclude_drafts | true | Whether to skip draft PRs |
| max_open_beads | 20 | Stop dispatching if this many open PR-patrol beads exist (safety valve) |
| patrol_label | pr-feedback-patrol | Label applied to dispatched beads for dedup tracking |
| author | @me | Only scan PRs by this GitHub login (`@me` = the gh user); empty = all authors |
| head_prefix | (empty) | Only scan PRs whose head branch starts with this prefix |"""

formula = "mol-pr-feedback-patrol"
version = 1

[vars]
[vars.wisp_type]
description = "Type of wisp created for this molecule"
default = "patrol"

[vars.rig]
description = "Target rig to sling polecats to for found work (e.g. dotfiles)"
required = true

[vars.repo]
description = "GitHub repo to scan in owner/name format (e.g. acme/myapp)"
required = true

[vars.base_branch]
description = "Base branch filter — only PRs targeting this branch are scanned"
default = "main"

[vars.scan_interval_seconds]
description = "Seconds to sleep between patrol cycles"
default = "300"

[vars.exclude_drafts]
description = "Whether to skip draft PRs (true/false)"
default = "true"

[vars.max_open_beads]
description = "Safety valve — stop dispatching if this many pr-feedback-patrol beads are already open"
default = "20"

[vars.patrol_label]
description = "Label applied to dispatched beads used for dedup guard"
default = "pr-feedback-patrol"

[vars.author]
description = "Only scan PRs authored by this GitHub login; @me = the gh user, empty = all authors"
default = "@me"

[vars.head_prefix]
description = "Only scan PRs whose head branch starts with this prefix (empty = any branch)"
default = ""

[[steps]]
id = "list-open-prs"
title = "List open PRs with review and CI status"
description = """
Fetch all open PRs from the target repo, including review decision and CI check rollup.

**1. Fetch open PRs with full status:**
```bash
gh pr list \
  --repo {{repo}} \
  --base {{base_branch}} \
  --state open \
  --json number,title,url,reviewDecision,statusCheckRollup,isDraft,headRefName,author,latestReviews \
  --limit 100 \
  > /tmp/open-prs.json
```

**2. Apply scope filters (author, head branch prefix, drafts):**
```bash
AUTHOR="{{author}}"
if [ "$AUTHOR" = "@me" ]; then AUTHOR=$(gh api user --jq .login); fi
jq --arg author "$AUTHOR" --arg prefix "{{head_prefix}}" --arg drafts "{{exclude_drafts}}" '[.[]
  | select($author == "" or .author.login == $author)
  | select(.headRefName | startswith($prefix))
  | select($drafts != "true" or .isDraft == false)]' \
  /tmp/open-prs.json > /tmp/open-prs-filtered.json
: > /tmp/patrol-findings.tsv
```

**3. Count and log:**
```bash
PR_COUNT=$(jq length /tmp/open-prs-filtered.json)
echo "Found ${PR_COUNT} open PRs in {{repo}}"
```

**4. Handle empty result:**
If PR_COUNT is 0, nothing to patrol — skip to loop-or-exit.

**Exit criteria:** /tmp/open-prs-filtered.json contains current open PRs with status fields.
"""

[[steps]]
id = "check-review-status"
title = "Filter PRs with review feedback needing response"
needs = ["list-open-prs"]
description = """
Identify PRs where reviewers have requested changes since the last push.

**1. Extract PRs with a change request newer than the head commit:**
A CHANGES_REQUESTED decision stays set until the reviewer re-reviews. If the
request predates the head commit, a fix was already pushed and the PR is
waiting for re-review, so it is not actionable. The head commit date is
fetched per PR because adding `commits` to the bulk `gh pr list` query
exceeds GitHub's GraphQL node limit.
```bash
jq -c '.[] | select(.reviewDecision == "CHANGES_REQUESTED")' /tmp/open-prs-filtered.json |
while read -r pr; do
  HEAD_DATE=$(gh pr view "$(jq -r .number <<<"$pr")" --repo {{repo}} \
    --json commits --jq '.commits[-1].committedDate')
  jq -c --arg head "$HEAD_DATE" 'select([.latestReviews[]?
    | select(.state == "CHANGES_REQUESTED" and .submittedAt > $head)] | length > 0)' <<<"$pr"
done | jq -s . > /tmp/prs-needs-review-response.json

REVIEW_COUNT=$(jq length /tmp/prs-needs-review-response.json)
echo "PRs with new CHANGES_REQUESTED: ${REVIEW_COUNT}"
```

**2. Record one tab-separated finding per PR:**
Fields are tab-separated because URLs and titles contain colons.
```bash
jq -r '.[] | ["review-feedback", .number, .url, .headRefName, .title, ""] | @tsv' \
  /tmp/prs-needs-review-response.json >> /tmp/patrol-findings.tsv
```

**Exit criteria:** /tmp/patrol-findings.tsv has one line per PR needing review response.
"""

[[steps]]
id = "check-ci-status"
title = "Filter PRs with failing or errored CI checks"
needs = ["list-open-prs"]
description = """
Identify PRs where CI checks have failed or errored.

statusCheckRollup mixes two shapes: CheckRun entries (GitHub Actions and
other apps) report `conclusion`, while commit StatusContext entries report
`state`. Both must be checked.

**1. Extract PRs with failing checks:**
```bash
FAILED='select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"
  or .conclusion == "STARTUP_FAILURE" or .state == "FAILURE" or .state == "ERROR")'
jq "[.[] | select([.statusCheckRollup[]? | ${FAILED}] | length > 0)]" \
  /tmp/open-prs-filtered.json > /tmp/prs-ci-failing.json

CI_COUNT=$(jq length /tmp/prs-ci-failing.json)
echo "PRs with failing CI: ${CI_COUNT}"
```

**2. Record one tab-separated finding per PR, with the failing check names:**
```bash
jq -r ".[] | [\"ci-failure\", .number, .url, .headRefName, .title,
  ([.statusCheckRollup[] | ${FAILED} | (.name // .context)] | join(\", \"))] | @tsv" \
  /tmp/prs-ci-failing.json >> /tmp/patrol-findings.tsv
```

**3. Dedup findings:**
A PR may appear in both review-feedback and ci-failure categories. The dedup
guard (next step) allows one unclosed patrol bead per PR, so the polecat
handling the first finding should address both.

**Exit criteria:** /tmp/patrol-findings.tsv contains all actionable PRs (review + CI).
"""

[[steps]]
id = "dispatch-work"
title = "Dispatch polecats for each actionable PR finding"
needs = ["check-review-status", "check-ci-status"]
description = """
For each finding in /tmp/patrol-findings.tsv, create a work bead and sling a
polecat onto the PR's existing head branch.

Beads count as outstanding until they are closed. Once slung, a bead is
`hooked` or `in_progress`, not `open`, so counting only `--status open` would
re-dispatch the same PR every cycle.

**Safety valve — check outstanding bead count first:**
```bash
unclosed() { bd list "$@" --json 2>/dev/null | jq '[.[] | select(.status != "closed")] | length'; }

OPEN_COUNT=$(unclosed --label "{{patrol_label}}")
if [ "${OPEN_COUNT:-0}" -ge {{max_open_beads}} ]; then
  echo "Safety valve: ${OPEN_COUNT} unclosed patrol beads already exist (max {{max_open_beads}}). Skipping dispatch."
  exit 0
fi
```

**For each finding:**
```bash
while IFS=$'\t' read -r TYPE PR_NUM PR_URL HEAD_REF PR_TITLE EXTRA; do
  [ -z "$TYPE" ] && continue

  # Dedup guard: one unclosed patrol bead per PR
  if [ "$(unclosed --label "{{patrol_label}}" --label "pr-num-${PR_NUM}")" -gt 0 ]; then
    echo "Skipping PR #${PR_NUM} (${TYPE}): unclosed bead already exists"
    continue
  fi

  if [ "$TYPE" = "review-feedback" ]; then
    TITLE="Address review feedback on PR #${PR_NUM}: ${PR_TITLE}"
    WHAT="A reviewer has requested changes on this PR. Address the feedback,
or reply with evidence where you disagree."
  elif [ "$TYPE" = "ci-failure" ]; then
    TITLE="Fix CI failure on PR #${PR_NUM}: ${PR_TITLE}"
    WHAT="CI checks are failing on this PR: ${EXTRA}
Investigate the failures and fix the code."
  else
    echo "Unknown finding type: ${TYPE} — skipping"
    continue
  fi
  BODY="## PR needs attention

PR: ${PR_URL}
Branch: ${HEAD_REF}
Type: ${TYPE}

${WHAT}

Push fixes to ${HEAD_REF} only. Do not open a new PR and do not merge.

Dispatched by mol-pr-feedback-patrol."

  BEAD_ID=$(bd create --silent \
    --title "$TITLE" \
    --type task \
    --priority 2 \
    --labels "{{patrol_label}},pr-num-${PR_NUM}" \
    --description "$BODY")
  if [ -z "$BEAD_ID" ]; then
    echo "Failed to create bead for PR #${PR_NUM} (${TYPE})"
    continue
  fi
  echo "Created bead ${BEAD_ID} for PR #${PR_NUM} (${TYPE})"

  # Resume on the PR's head branch so the fix lands in the existing PR.
  # --branch rather than --pr: --pr resolves via 'gh pr view' in the cwd,
  # which fails outside a git checkout with a GitHub remote.
  if ! gt sling "$BEAD_ID" {{rig}} --branch "$HEAD_REF" --no-merge; then
    echo "Sling failed for ${BEAD_ID}; closing it so the next cycle retries"
    bd close "$BEAD_ID" --reason "mol-pr-feedback-patrol: sling failed" >/dev/null || true
  fi
done < /tmp/patrol-findings.tsv
```

**Exit criteria:** All actionable PRs have either a newly created+slung bead, or were
skipped because an unclosed bead already exists.
"""

[[steps]]
id = "loop-or-exit"
title = "Sleep then respawn for next patrol cycle"
needs = ["dispatch-work"]
description = """
Context-check and either sleep for the next cycle or exit if context is filling.

**1. Check remaining context capacity:**
```bash
# A rough proxy: check if we're getting close to context limits
# by checking if the session has been running for a long time.
# Gas Town agents typically cycle every 30-60 minutes.
gt mol step context-check 2>/dev/null || true
```

**2. Clean up temp files from this cycle:**
```bash
rm -f /tmp/open-prs.json /tmp/open-prs-filtered.json
rm -f /tmp/prs-needs-review-response.json /tmp/prs-ci-failing.json
rm -f /tmp/patrol-findings.tsv
```

**3. Sleep before next cycle:**
```bash
echo "Patrol cycle complete. Sleeping {{scan_interval_seconds}}s before next cycle."
sleep {{scan_interval_seconds}}
```

**4. Respawn by looping back to list-open-prs:**
After sleep, close this step and immediately reopen list-open-prs to begin the next cycle.

```bash
# Respawn: start the next patrol cycle
bd mol step respawn --target list-open-prs
```

**Context filling:** If the session is near context capacity, use `gt handoff` to
cycle to a fresh session rather than respawning:
```bash
gt handoff -s "PR feedback patrol cycling" -m "Next cycle: scan {{repo}} for PR feedback and CI failures."
```

**Exit criteria:** Next patrol cycle initiated (either via respawn or handoff).
"""
